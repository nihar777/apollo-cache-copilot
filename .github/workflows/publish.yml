name: Publish

on:
  # Tag push is the primary trigger: `git tag v1.0.1 && git push --tags`.
  push:
    tags: ['v*']
  # Also fires when a GitHub Release is published from an existing tag.
  release:
    types: [published]

# A tag and its release both firing would race two publishes of one version.
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest

    permissions:
      contents: read
      # Trusted publishing: npm exchanges this OIDC token for a short-lived
      # publish credential, and for the Sigstore provenance attestation.
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # Trusted publishing needs npm >= 11.5.1 (checked below). Node 22
          # bundles npm 10, Node 24 bundles npm 11. Node 20/22 compatibility is
          # covered by the ci.yml matrix, not by this job.
          node-version: '24.x'
          registry-url: 'https://registry.npmjs.org'
          # No dependency cache: release builds should not restore a cache an
          # earlier, less trusted run could have written.

      # Trusted publishing is configured on npmjs.com for this exact repo and
      # workflow filename (publish.yml, case-sensitive). No NPM_TOKEN is used.
      - name: Verify npm supports trusted publishing
        run: |
          set -euo pipefail
          v="$(npm --version)"
          echo "npm $v, node $(node --version)"
          node -e '
            const [a,b,c]=process.argv[1].split(".").map(Number);
            const ok=a>11||(a===11&&(b>5||(b===5&&c>=1)));
            if(!ok){console.error("::error::npm "+process.argv[1]+" < 11.5.1, trusted publishing unavailable");process.exit(1)}
          ' "$v"

      - name: Install dependencies
        run: npm ci

      # Publishing v1.0.1 from a tree that says 1.0.0 puts the wrong version on
      # the registry, and npm won't catch it — the tag is only a git ref.
      - name: Verify tag matches package version
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p 'require("./package.json").version')"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::tag v$tag does not match package.json version $pkg"
            exit 1
          fi
          echo "Publishing version $pkg"

      # Build first: the integration and E2E suites, and tsconfig.test.json,
      # all resolve `dist/` — typecheck and vitest fail against an absent build.
      - name: Build
        run: npm run build

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Pack (dry run)
        run: npm pack --dry-run

      # Authenticates via OIDC (trusted publisher); no token or secret is read.
      - name: Publish
        run: npm publish --access public --provenance
