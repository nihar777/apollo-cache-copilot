name: Publish

on:
  # Tag push is the primary trigger: `git tag v1.0.1 && git push --tags`.
  push:
    tags: ['v*']
  # Also fires when a GitHub Release is published from an existing tag.
  release:
    types: [published]

# A tag and its release both firing would race two publishes of one version.
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest

    permissions:
      contents: read
      # Required for --provenance: npm exchanges this for a Sigstore attestation.
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # Lowest supported version, so we publish what the floor can build.
          node-version: '20.x'
          cache: npm
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      # Publishing v1.0.1 from a tree that says 1.0.0 puts the wrong version on
      # the registry, and npm won't catch it — the tag is only a git ref.
      - name: Verify tag matches package version
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p 'require("./package.json").version')"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::tag v$tag does not match package.json version $pkg"
            exit 1
          fi
          echo "Publishing version $pkg"

      # Build first: the integration and E2E suites, and tsconfig.test.json,
      # all resolve `dist/` — typecheck and vitest fail against an absent build.
      - name: Build
        run: npm run build

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Pack (dry run)
        run: npm pack --dry-run

      - name: Publish
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
