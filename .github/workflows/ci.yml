name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# Cancel superseded runs on the same ref — a force-push doesn't need the old run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest

    strategy:
      # One red version shouldn't hide the state of the others.
      fail-fast: false
      matrix:
        # Node 18 is deliberately absent: vitest 4 declares
        # `^20 || ^22 || >=24` and @langchain/core declares `>=20`.
        # Add '18.x' back only after those constraints change.
        node-version: ['20.x', '22.x']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Build runs FIRST: the integration tests and tsconfig.test.json both
      # import `dist/`, so typecheck and vitest fail against an absent build.
      - name: Build
        run: npm run build

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Verify build outputs
        run: |
          set -euo pipefail
          for f in \
            dist/index.js \
            dist/index.d.ts \
            dist/mcp/server.js \
            dist/mcp/server.d.ts \
            dist/tools/inspectDanglingRefs.js \
            dist/tools/patchCache.js \
            dist/agent/graph.js \
            dist/schemas/tools.js
          do
            test -s "$f" || { echo "::error::missing or empty build output: $f"; exit 1; }
          done
          # Tests are excluded from the build; a stray one in dist means
          # tsconfig.json's exclude regressed.
          if find dist -path '*__tests__*' -o -path '*__mocks__*' | grep -q .; then
            echo "::error::test/fixture files leaked into dist"
            exit 1
          fi
          # The published entry points must actually load.
          node -e "import('./dist/index.js').then(m => { if (!m.inspectDanglingRefs) throw new Error('missing export'); })"
          node --input-type=module -e "import('./dist/mcp/server.js').then(m => m.createServer())"

      - name: Pack (dry run)
        run: npm pack --dry-run

      # The step above only lists what ships; the checks above it import
      # `./dist/...` by relative path, which never consults the `exports` map.
      # An exports target missing its `./` prefix is therefore invisible to
      # every other step and breaks every consumer. Install the real tarball
      # and import by package name — the way a user does.
      - name: Verify the tarball resolves by package name
        run: |
          set -euo pipefail
          tgz="$(npm pack --silent)"
          tmp="$(mktemp -d)"
          mv "$tgz" "$tmp/"
          cd "$tmp"
          npm init -y >/dev/null 2>&1
          npm install --silent "./$tgz"

          # Both documented entry points, resolved through `exports`.
          node -e "import('apollo-cache-copilot').then(m => {
            if (typeof m.inspectDanglingRefs !== 'function') throw new Error('missing inspectDanglingRefs export');
            if (typeof m.patchCache !== 'function') throw new Error('missing patchCache export');
          })"
          node -e "import('apollo-cache-copilot/server').then(m => m.createServer())"

          # And the installed CLI, on a snapshot with one seeded defect.
          cat > snap.json <<'JSON'
          {
            "ROOT_QUERY": { "__typename": "Query", "u": { "__ref": "User:1" } },
            "User:1": { "__typename": "User", "id": "1", "avatar": { "__ref": "Avatar:99" } }
          }
          JSON
          npx apollo-copilot inspect snap.json | tee out.txt
          grep -q 'ORPHANED_REF' out.txt || { echo "::error::installed CLI did not report the seeded defect"; exit 1; }
